<div class="p-6">
    <h2 class="text-2xl font-semibold mb-4">Gestion des tâches</h2>

    <button
            routerLink="/add-task"
            class="px-4 py-2 bg-purple-600 text-white rounded hover:bg-purple-700 mb-4 flex items-center"
    >
        + Ajouter une tâche
    </button>

    <table class="min-w-full border border-gray-200 rounded-lg shadow-sm">
        <thead class="bg-gray-100">
        <tr>
            <th class="px-4 py-2 text-left">ID</th>
            <th class="px-4 py-2 text-left">Titre</th>
            <th class="px-4 py-2 text-left">Description</th>
            <th class="px-4 py-2 text-left">Assignée à</th>
            <th class="px-4 py-2 text-left">Date limite</th>
            <th class="px-4 py-2 text-left">Statut</th>
            <th class="px-4 py-2 text-left">Créée le</th>
            <th class="px-4 py-2 text-left">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let task of tasks" class="border-t">
            <td class="px-4 py-2">{{ task.id }}</td>
            <td class="px-4 py-2">{{ task.title }}</td>
            <td class="px-4 py-2">{{ task.description }}</td>
            <td class="px-4 py-2">{{ task.assignedTo }}</td>
            <td class="px-4 py-2">{{ task.deadline | date:'mediumDate' }}</td>
            <td class="px-4 py-2">
          <span
                  class="px-2 py-1 rounded text-white"
                  [ngClass]="{
              'bg-green-500': task?.status === 'Terminée',
              'bg-yellow-500': task?.status === 'En cours',
              'bg-red-500': task?.status === 'En retard'
            }"
          >
            {{ task?.status || 'Non défini' }}
          </span>
            </td>
            <td class="px-4 py-2">{{ task.createdAt | date:'mediumDate' }}</td>
            <td class="px-4 py-2 flex space-x-2">
                <button
                        (click)="editTask(task.id)"
                        class="p-2 bg-blue-500 text-white rounded hover:bg-blue-600"
                        title="Modifier"
                >
                    ✏️
                </button>
                <button
                        (click)="deleteTask(task.id)"
                        class="p-2 bg-red-500 text-white rounded hover:bg-red-600"
                        title="Supprimer"
                >
                    🗑️
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
