<form
        class="bg-white mt-8 flex w-full flex-col space-y-6 rounded-2xl p-8 shadow"
        [formGroup]="teacherForm"
>
    <div class="flex flex-wrap gap-4 w-full">
        <mat-form-field class="flex-1 min-w-[200px]">
            <mat-label>Prénom</mat-label>
            <input matInput formControlName="firstName" autocomplete="off" />
        </mat-form-field>

        <mat-form-field class="flex-1 min-w-[200px]">
            <mat-label>Nom</mat-label>
            <input matInput formControlName="lastName" autocomplete="off" />
        </mat-form-field>
    </div>

    <div class="flex flex-wrap gap-4 w-full">
        <mat-form-field class="flex-1 min-w-[200px]">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" autocomplete="off" />
        </mat-form-field>

        <mat-form-field class="flex-1 min-w-[200px]">
            <mat-label>Téléphone</mat-label>
            <input matInput formControlName="tel" autocomplete="off" />
        </mat-form-field>
    </div>

    <div class="flex flex-wrap gap-4 w-full">
        <mat-form-field class="flex-1 min-w-[200px]">
            <mat-label>Département</mat-label>
            <input matInput formControlName="department" autocomplete="off" />
        </mat-form-field>
    </div>

    <div class="mt-6 flex w-full items-center justify-end">
        <button (click)="reset()" type="button" mat-button>Réinitialiser</button>
        <button (click)="save()" class="ml-2" type="button" mat-flat-button color="primary">
            Enregistrer
        </button>
    </div>
</form>
