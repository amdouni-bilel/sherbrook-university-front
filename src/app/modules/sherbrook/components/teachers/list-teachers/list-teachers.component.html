<mat-drawer-container
        class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:absolute sm:inset-0 sm:overflow-hidden">

    <!-- Main Content -->
    <div mat-drawer-content class="flex min-w-0 flex-auto flex-col">

        <!-- Header -->
        <div class="bg-card flex flex-0 flex-col border-b p-6 sm:flex-row sm:items-center sm:justify-between sm:px-10 sm:py-8">
            <!-- Titre + lien -->
            <div class="min-w-0 flex-1">
                <div class="flex flex-wrap items-center font-medium">
                </div>
                <div class="mt-2">
                    <h2 class="truncate text-3xl font-extrabold leading-7 tracking-tight sm:leading-10 md:text-4xl">
                        Gestion des enseignants
                    </h2>
                </div>
            </div>

            <!-- Bouton "Ajouter un professeur" -->
            <div class="mt-4 sm:mt-0">
                <button
                        mat-flat-button
                        color="primary"
                        class="rounded-full"
                        [routerLink]="['/add-teacher']">
                    <mat-icon class="mr-2">add</mat-icon>
                    Ajouter un enseignant
                </button>
            </div>
        </div>

        <!-- Resource Table -->
        <div class="flex flex-auto overflow-hidden">
            <div class="flex flex-auto flex-col overflow-hidden sm:mb-18 sm:overflow-y-auto">
                <div class="overflow-x-auto">
                    <table class="min-w-full table-auto whitespace-nowrap">
                        <thead>
                        <tr class="bg-gray-200 text-gray-600">
                            <th class="px-6 py-3 text-left">ID</th>
                            <th class="px-6 py-3 text-left">Prénom</th>
                            <th class="px-6 py-3 text-left">Nom</th>
                            <th class="px-6 py-3 text-left">Email</th>
                            <th class="px-6 py-3 text-left">Téléphone</th>
                            <th class="px-6 py-3 text-left">Département</th>
                            <th class="px-6 py-3 text-left">Créé le</th>
                            <th class="px-6 py-3 text-left">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr *ngFor="let teacher of teachers" class="border-b hover:bg-gray-100">
                            <td class="px-6 py-4">{{ teacher.id }}</td>
                            <td class="px-6 py-4">{{ teacher.firstName }}</td>
                            <td class="px-6 py-4">{{ teacher.lastName }}</td>
                            <td class="px-6 py-4">{{ teacher.email }}</td>
                            <td class="px-6 py-4">{{ teacher.phone || '--' }}</td>
                            <td class="px-6 py-4">{{ teacher.department || '--' }}</td>
                            <td class="px-6 py-4">{{ teacher.createdAt }}</td>
                            <td class="px-6 py-4 flex gap-2">
                                <button
                                        matTooltip="Modifier"
                                        class="text-blue-600 hover:underline"
                                        [routerLink]="['/update-teacher', teacher.id]">
                                    <mat-icon svgIcon="heroicons_outline:pencil"></mat-icon>
                                </button>

                                <button
                                        matTooltip="Supprimer"
                                        class="text-red-600 hover:underline"
                                        (click)="deleteTeacher(teacher.id)">
                                    <mat-icon svgIcon="heroicons_outline:trash"></mat-icon>
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Aucun professeur trouvé -->
                <ng-container *ngIf="!loading && !error && teachers.length === 0">
                    <div class="border-t p-8 text-center text-4xl font-semibold tracking-tight sm:p-16">
                        Aucun professeur trouvé !
                    </div>
                </ng-container>
            </div>
        </div>
    </div>
</mat-drawer-container>
